<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Aurora Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent-1: #a855f7;
    --accent-2: #ec4899;
    --accent-3: #06b6d4;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #f5f5f7;
    --text-dim: #a0a0b0;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-1);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Анимированный фон ===== */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    animation: float 20s ease-in-out infinite;
  }
  .orb1 { width: 400px; height: 400px; background: var(--accent-1); top: -100px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 350px; height: 350px; background: var(--accent-2); bottom: -100px; right: -80px; animation-delay: -7s; }
  .orb3 { width: 300px; height: 300px; background: var(--accent-3); top: 40%; left: 50%; animation-delay: -14s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(80px, -60px) scale(1.15); }
    66%      { transform: translate(-60px, 70px) scale(0.9); }
  }

  /* ===== Частицы ===== */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(100vh) scale(0); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(-20vh) scale(1.5); }
  }

  /* ===== Основной контейнер ===== */
  .app {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 34px 30px;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    animation: appIn 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes appIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== Заголовок ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(168, 85, 247, 0.5); }
    50%      { box-shadow: 0 8px 40px rgba(236, 72, 153, 0.7); }
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    background: linear-gradient(135deg, #fff, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Прогресс-кольцо */
  .progress-ring {
    width: 46px; height: 46px;
    position: relative;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring circle {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .progress-ring .bg   { stroke: rgba(255,255,255,0.1); }
  .progress-ring .bar  {
    stroke: url(#grad);
    stroke-dasharray: 126;
    stroke-dashoffset: 126;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-ring .pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
  }

  /* ===== Поле ввода ===== */
  .input-wrap {
    position: relative;
    margin-bottom: 22px;
  }
  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 17px 60px 17px 20px;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .input-wrap input::placeholder { color: var(--text-dim); }
  .input-wrap input:focus {
    background: rgba(255,255,255,0.08);
    border-color: rgba(168, 85, 247, 0.6);
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15),
                0 8px 24px rgba(168, 85, 247, 0.2);
  }

  .add-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 42px; height: 42px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
  }
  .add-btn:hover {
    transform: translateY(-50%) scale(1.08) rotate(90deg);
    box-shadow: 0 8px 28px rgba(236, 72, 153, 0.6);
  }
  .add-btn:active { transform: translateY(-50%) scale(0.95) rotate(90deg); }

  /* ===== Фильтры ===== */
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: rgba(255,255,255,0.04);
    padding: 5px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .filters button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s ease;
    position: relative;
  }
  .filters button:hover { color: var(--text); }
  .filters button.active {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
  }

  /* ===== Список ===== */
  ul { list-style: none; }

  li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    margin-bottom: 10px;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    animation: taskIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }
  li::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s ease;
  }
  li:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(168, 85, 247, 0.3);
    transform: translateX(4px);
  }
  li:hover::before { transform: scaleY(1); }

  @keyframes taskIn {
    from { opacity: 0; transform: translateX(-20px) scale(0.95); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  li.removing {
    animation: taskOut 0.4s cubic-bezier(0.55, 0, 1, 0.45) forwards;
  }
  @keyframes taskOut {
    to { opacity: 0; transform: translateX(60px) scale(0.9); max-height: 0; padding: 0; margin: 0; }
  }

  /* Чекбокс */
  .checkbox {
    width: 24px; height: 24px;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  .checkbox:hover { border-color: var(--accent-1); }
  .checkbox svg {
    width: 14px; height: 14px;
    stroke: #fff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    transition: stroke-dashoffset 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  li.done .checkbox {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(168, 85, 247, 0.5);
    animation: checkPop 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  li.done .checkbox svg { stroke-dashoffset: 0; }
  @keyframes checkPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    word-break: break-word;
    transition: all 0.3s ease;
    position: relative;
  }
  .task-text::after {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 100%; height: 2px;
    background: var(--text-dim);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  li.done .task-text {
    color: var(--text-dim);
  }
  li.done .task-text::after { transform: scaleX(1); }

  /* Кнопка удаления */
  .delete-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.25);
    font-size: 22px;
    cursor: pointer;
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    opacity: 0;
    transform: scale(0.7);
  }
  li:hover .delete-btn { opacity: 1; transform: scale(1); }
  .delete-btn:hover {
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.15);
    transform: scale(1.1) rotate(90deg);
  }

  /* Пустое состояние */
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
    animation: taskIn 0.5s ease;
  }
  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: inline-block;
    animation: float-icon 3s ease-in-out infinite;
  }
  @keyframes float-icon {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-10px) rotate(5deg); }
  }
  .empty-text {
    font-size: 14px;
    font-weight: 400;
  }

  /* ===== Футер ===== */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 12px;
    color: var(--text-dim);
  }
  .stats { display: flex; gap: 16px; }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  }
  .stat-dot.done { background: #4ade80; }

  .clear-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: all 0.25s ease;
  }
  .clear-btn:hover {
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.1);
  }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(3.5); opacity: 0; }
  }

  /* Адаптив */
  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .app { padding: 26px 20px; border-radius: 22px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<!-- Фон с орбами -->
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<!-- Частицы -->
<div class="particles" id="particles"></div>

<!-- Приложение -->
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <h1>Aurora Tasks</h1>
        <div class="subtitle">Focus & Flow</div>
      </div>
    </div>
    <div class="progress-ring">
      <svg width="46" height="46">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <circle class="bg" cx="23" cy="23" r="20"/>
        <circle class="bar" cx="23" cy="23" r="20" id="progressBar"/>
      </svg>
      <div class="pct" id="progressPct">0%</div>
    </div>
  </header>

  <div class="input-wrap">
    <input type="text" id="taskInput" placeholder="Что нужно сделать?" maxlength="100" autocomplete="off">
    <button class="add-btn" id="addBtn" title="Добавить">+</button>
  </div>

  <div class="filters">
    <button data-filter="all" class="active">Все</button>
    <button data-filter="active">Активные</button>
    <button data-filter="done">Готово</button>
  </div>

  <ul id="taskList"></ul>

  <footer>
    <div class="stats">
      <div class="stat">
        <span class="stat-dot"></span>
        <span id="activeCount">0 активных</span>
      </div>
      <div class="stat">
        <span class="stat-dot done"></span>
        <span id="doneCount">0 готово</span>
      </div>
    </div>
    <button class="clear-btn" id="clearBtn">Очистить ✓</button>
  </footer>
</div>

<script>
  const STORAGE_KEY = 'aurora_todos_v1';

  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  let currentFilter = 'all';

  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('taskList');
  const activeCountEl = document.getElementById('activeCount');
  const doneCountEl = document.getElementById('doneCount');
  const progressBar = document.getElementById('progressBar');
  const progressPct = document.getElementById('progressPct');
  const clearBtn = document.getElementById('clearBtn');

  /* ===== Частицы ===== */
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (-Math.random() * 20) + 's';
    const colors = ['#a855f7', '#ec4899', '#06b6d4', '#ffffff'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
    particlesContainer.appendChild(p);
  }

  /* ===== Логика ===== */
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function updateProgress() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    const offset = 126 - (126 * pct / 100);
    progressBar.style.strokeDashoffset = offset;
    progressPct.textContent = pct + '%';
  }

  function render() {
    list.innerHTML = '';

    let filtered = tasks;
    if (currentFilter === 'active') filtered = tasks.filter(t => !t.done);
    if (currentFilter === 'done')   filtered = tasks.filter(t => t.done);

    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      const icons = { all: '🌌', active: '🎯', done: '🎉' };
      const texts = {
        all: 'Пока нет задач — добавь первую!',
        active: 'Все задачи выполнены ✨',
        done: 'Ещё ничего не завершено'
      };
      empty.innerHTML = `
        <div class="empty-icon">${icons[currentFilter]}</div>
        <div class="empty-text">${texts[currentFilter]}</div>
      `;
      list.appendChild(empty);
    } else {
      filtered.forEach((task, i) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('done');
        li.style.animationDelay = (i * 0.04) + 's';
        li.dataset.id = task.id;

        const cb = document.createElement('div');
        cb.className = 'checkbox';
        cb.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '×';
        del.title = 'Удалить';

        cb.addEventListener('click', e => { e.stopPropagation(); toggleTask(task.id); });
        li.addEventListener('click', () => toggleTask(task.id));
        del.addEventListener('click', e => { e.stopPropagation(); deleteTask(task.id, li); });

        li.append(cb, span, del);
        list.appendChild(li);
      });
    }

    const active = tasks.filter(t => !t.done).length;
    const done = tasks.filter(t => t.done).length;
    activeCountEl.textContent = active + ' активных';
    doneCountEl.textContent = done + ' готово';

    updateProgress();
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) {
      input.focus();
      input.style.animation = 'none';
      setTimeout(() => {
        input.style.animation = 'shake 0.4s';
      }, 10);
      return;
    }
    tasks.unshift({
      id: Date.now(),
      text: text,
      done: false,
      created: new Date().toISOString()
    });
    input.value = '';
    save();
    render();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (t) {
      t.done = !t.done;
      save();
      render();
    }
  }

  function deleteTask(id, li) {
    li.classList.add('removing');
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }, 380);
  }

  /* ===== Ripple эффект на кнопке ===== */
  addBtn.addEventListener('click', e => {
    const rect = addBtn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    addBtn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    addTask();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  clearBtn.addEventListener('click', () => {
    if (!tasks.some(t => t.done)) return;
    const done = tasks.filter(t => t.done).length;
    if (confirm(`Удалить ${done} выполненных задач?`)) {
      tasks = tasks.filter(t => !t.done);
      save();
      render();
    }
  });

  // Shake анимация для пустого поля
  const style = document.createElement('style');
  style.textContent = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
  `;
  document.head.appendChild(style);

  render();
</script>

</body>
</html>
